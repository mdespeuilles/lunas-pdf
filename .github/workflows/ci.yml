name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (WebKitGTK)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun pdfium
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: bun run typecheck

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev qpdf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun pdfium
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fixture scanné (70 Mo, non versionné)
        run: |
          pip install -r fixtures/scripts/requirements.txt
          python fixtures/scripts/gen_fixtures.py fixtures --only scan-lourd
      - name: Tests Rust (moteur, préférences, export des types)
        run: cargo test --workspace
      - name: Types TypeScript à jour
        run: git diff --exit-code src/bindings.ts
      - name: Tests unitaires (Vitest)
        run: bun run test
      - name: Tests de parcours (Playwright, WebKit et Chromium)
        run: bunx playwright install --with-deps webkit chromium && bun run test:e2e
      - name: Fixtures valides (qpdf --check)
        run: |
          for f in fixtures/*.pdf; do
            qpdf --check --password=feuillet "$f" > /dev/null || { echo "::error file=$f::qpdf --check a échoué"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/

  build:
    name: Build ${{ matrix.name }}
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: appimage,deb,rpm
          - name: macOS
            os: macos-14
            bundles: app,dmg
          - name: Windows
            os: windows-latest
            bundles: msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun pdfium
      - run: bun tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: lunas-pdf-${{ matrix.name }}
          path: |
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
          if-no-files-found: error
