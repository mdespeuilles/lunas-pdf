[package]
name = "feuillet-core"
description = "Moteur PDF de Feuillet : lecture et rendu via PDFium (voir docs/ADR-001)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pdfium-render.workspace = true
serde.workspace = true
specta.workspace = true
thiserror.workspace = true
image.workspace = true
lopdf = "0.45"
flate2 = "1"
# Vérification des signatures numériques (CMS / PKCS#7, RustCrypto, Apache-2.0 / MIT).
cms = "0.2"
x509-cert = "0.2"
der = { version = "0.7", features = ["oid", "derive", "alloc"] }
spki = "0.7"
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
rustls-native-certs = "0.8"
# Listes de confiance (UE, Microsoft) : analyse et téléchargement.
quick-xml = "0.38"
base64 = "0.22"
serde_json.workspace = true
ureq = { version = "2", optional = true }

[features]
# Téléchargement des listes de confiance (application, régénération de l'instantané).
trust-fetch = ["dep:ureq"]

[dev-dependencies]
der = { version = "0.7", features = ["pem"] }
