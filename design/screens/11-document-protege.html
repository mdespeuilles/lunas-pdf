<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<title>Feuillet — Document protégé</title>
<script src="5b16fdd1-01c1-4ce1-bb23-64863230ac57"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.board{box-sizing:border-box;display:flex;gap:64px;padding:48px;align-items:flex-start;background:#d6d6db;font-family:system-ui,-apple-system,"Cantarell","Noto Sans","Segoe UI",Ubuntu,sans-serif;-webkit-font-smoothing:antialiased}
.bcol{display:flex;flex-direction:column;gap:14px}
.blabel{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#45454d}
.th{--accent:#3466f6;--on-accent:#fff;--bg:#f7f7f8;--chrome:#eeeef1;--canvas:#dcdce1;--surface:#fff;--surface-2:#f3f3f5;--line:rgba(20,20,35,.10);--line-2:rgba(20,20,35,.18);--text:#1b1b20;--text-2:#52525c;--text-3:#696973;--hover:rgba(20,20,35,.06);--bad:#c02a2a;--shadow-lg:0 2px 8px rgba(0,0,0,.08),0 24px 60px rgba(0,0,0,.22);--accent-soft:color-mix(in oklab,var(--accent) 13%,transparent);--accent-text:color-mix(in oklab,var(--accent) 80%,black);color:var(--text);font-size:13px;line-height:1.4}
.th.dark{--bg:#1e1e22;--chrome:#27272c;--canvas:#131316;--surface:#2d2d33;--surface-2:#35353b;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.17);--text:#ededf1;--text-2:#acacb6;--text-3:#93939e;--hover:rgba(255,255,255,.07);--bad:#ff7a7a;--shadow-lg:0 2px 8px rgba(0,0,0,.3),0 24px 60px rgba(0,0,0,.6);--accent-soft:color-mix(in oklab,var(--accent) 26%,transparent);--accent-text:color-mix(in oklab,var(--accent) 55%,white)}
.win{position:relative;box-sizing:border-box;width:1280px;height:800px;border-radius:12px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(0,0,0,.16),0 30px 80px rgba(20,20,40,.28)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:16px;height:16px}.ic.xs{width:14px;height:14px}.ic.l{width:26px;height:26px;stroke-width:1.6}
.titlebar{display:flex;align-items:center;gap:4px;height:42px;padding:0 10px;background:var(--chrome);flex:none}
.tab{display:flex;align-items:center;gap:8px;height:30px;width:210px;padding:0 5px 0 10px;border-radius:8px;color:var(--text-2);box-sizing:border-box;font-size:12.5px}
.tab .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.06)}
.th.dark .tab.on{background:var(--surface-2)}
.cl{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--text-3);border:0;background:transparent;padding:0}
.drag{flex:1;align-self:stretch}
.wctl{display:flex;gap:10px;padding-left:8px}
.wbtn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--hover);color:var(--text-2);border:0;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 16px;border-radius:7px;border:0;font:inherit;font-size:13px;font-weight:500;background:var(--hover);color:var(--text);white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.gh{background:transparent;color:var(--text-2)}
.toolbar{display:flex;align-items:center;gap:4px;height:46px;padding:0 10px;background:var(--chrome);border-bottom:1px solid var(--line);flex:none}
.tb{position:relative;display:grid;place-items:center;width:32px;height:32px;border-radius:7px;color:var(--text-2);background:transparent;border:0;padding:0;font:inherit;flex:none}
.tb.w{display:flex;width:auto;padding:0 10px;gap:7px;font-size:13px;font-weight:500}
.off{opacity:.38}
.sep{width:1px;height:20px;background:var(--line-2);margin:0 6px;flex:none}
.grow{flex:1}
.muted{color:var(--text-2);font-size:12.5px}
.canvas{flex:1;position:relative;overflow:hidden;background:var(--canvas);display:flex;flex-direction:column;align-items:center}
.page{flex:none;width:600px;height:848px;margin-top:28px;background:#fff;box-sizing:border-box;padding:52px 66px;display:flex;flex-direction:column;gap:8px;filter:blur(7px);opacity:.75}
.th.dark .page{opacity:.25}
.ln{height:6px;border-radius:3px;background:#cfcfd6;flex:none}
.ln.h{height:14px;width:60%;background:#8f8f98;margin-bottom:10px}
.ln.k{width:35%;background:#a7a7b0;margin-top:14px}
.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card{width:400px;box-sizing:border-box;padding:30px 30px 24px;border-radius:16px;background:var(--surface);box-shadow:0 0 0 1px var(--line),var(--shadow-lg);display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.lic{display:grid;place-items:center;width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--accent-text);margin-bottom:10px}
.card h2{margin:0;font-size:17px;font-weight:600}
.card p{margin:0 0 14px;color:var(--text-2);font-size:13px;line-height:1.5}
.inp{display:flex;align-items:center;gap:8px;width:100%;height:36px;border-radius:8px;background:var(--surface);color:var(--text);padding:0 6px 0 12px;font-size:14px;box-sizing:border-box;letter-spacing:.14em;box-shadow:inset 0 0 0 1px var(--bad),0 0 0 3px color-mix(in oklab,var(--bad) 22%,transparent)}
.inp .t{flex:1;text-align:left}
.inp button{display:grid;place-items:center;width:26px;height:26px;border-radius:6px;border:0;background:transparent;color:var(--text-3);padding:0}
.err{display:flex;align-items:center;gap:6px;align-self:flex-start;margin-top:6px;font-size:12.5px;color:var(--bad)}
.cb{display:grid;place-items:center;width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--line-2);background:var(--surface);flex:none}
.row{display:flex;align-items:center;gap:8px}
</style>
</helmet>
<div class="board" style="width: 2720px; height: 924px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="bcol">
<div class="blabel">{{t.label}}</div>
<div class="{{t.th}} win" style="--accent: {{accent}}">
<div class="titlebar">
<div class="tab"><svg class="ic s" sc-camel-view-box="0 0 24 24"><path d="{{i.file}}"></path></svg><span class="nm">Contrat de prestation.pdf</span><button class="cl" aria-label="Fermer l’onglet"><svg class="ic xs" sc-camel-view-box="0 0 24 24"><path d="{{i.x}}"></path></svg></button></div>
<div class="tab on"><svg class="ic s" sc-camel-view-box="0 0 24 24"><path d="{{i.lock}}"></path></svg><span class="nm">Relevé de compte.pdf</span><button class="cl" aria-label="Fermer l’onglet (Ctrl W)"><svg class="ic xs" sc-camel-view-box="0 0 24 24"><path d="{{i.x}}"></path></svg></button></div>
<button class="cl" style="width: 30px; height: 30px; border-radius: 8px" aria-label="Ouvrir un document (Ctrl O)"><svg class="ic s" sc-camel-view-box="0 0 24 24"><path d="{{i.plus}}"></path></svg></button>
<div class="drag"></div>
<div class="wctl">
<button class="wbtn" aria-label="Réduire"><svg class="ic xs" sc-camel-view-box="0 0 24 24"><path d="{{i.min}}"></path></svg></button>
<button class="wbtn" aria-label="Agrandir"><svg class="ic xs" sc-camel-view-box="0 0 24 24"><path d="{{i.max}}"></path></svg></button>
<button class="wbtn" aria-label="Fermer la fenêtre"><svg class="ic xs" sc-camel-view-box="0 0 24 24"><path d="{{i.x}}"></path></svg></button>
</div>
</div>
<div class="toolbar">
<div class="row off">
<button class="tb" disabled="" aria-label="Barre latérale (F9)"><svg class="ic" sc-camel-view-box="0 0 24 24"><path d="{{i.sidebar}}"></path></svg></button>
<div class="sep"></div>
<span class="muted">Page – sur –</span>
</div>
<div class="grow"></div>
<div class="row off">
<button class="tb w" disabled=""><svg class="ic" sc-camel-view-box="0 0 24 24"><path d="{{i.pen}}"></path></svg>Annoter</button>
<button class="tb" disabled="" aria-label="Partager et exporter"><svg class="ic" sc-camel-view-box="0 0 24 24"><path d="{{i.share}}"></path></svg></button>
</div>
</div>
<div class="canvas">
<div class="page"><div class="ln h"></div><div class="ln"></div><div class="ln" style="width: 80%"></div><div class="ln k"></div><div class="ln"></div><div class="ln"></div><div class="ln" style="width: 66%"></div><div class="ln k"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln" style="width: 50%"></div></div>
<div class="over">
<div class="card" role="dialog" aria-labelledby="lk-title">
<span class="lic"><svg class="ic l" sc-camel-view-box="0 0 24 24"><path d="{{i.lock}}"></path></svg></span>
<h2 id="lk-title">Ce document est protégé</h2>
<p>Saisissez le mot de passe pour ouvrir<br>« Relevé de compte.pdf ».</p>
<div class="inp"><span class="t">••••••••</span><button aria-label="Afficher le mot de passe"><svg class="ic s" sc-camel-view-box="0 0 24 24"><path d="{{i.eye}}"></path></svg></button></div>
<span class="err" role="alert"><svg class="ic xs" sc-camel-view-box="0 0 24 24"><path d="{{i.alert}}"></path></svg>Mot de passe incorrect. Vérifiez la casse et réessayez.</span>
<label class="row" style="align-self: flex-start; margin-top: 12px; font-size: 12.5px; color: var(--text-2)"><span class="cb"></span>Mémoriser dans le trousseau du système</label>
<div class="row" style="align-self: stretch; justify-content: flex-end; margin-top: 18px">
<button class="btn gh">Fermer l’onglet</button>
<button class="btn pri">Déverrouiller</button>
</div>
</div>
</div>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;both&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;both&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#3466f6&quot;,&quot;#7048e8&quot;,&quot;#e8590c&quot;,&quot;#0c8a6b&quot;],&quot;default&quot;:&quot;#3466f6&quot;},&quot;$preview&quot;:{&quot;width&quot;:2720,&quot;height&quot;:924}}">
class Component extends DCLogic {
  icons() {
    return {
      file: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6',
      x: 'M18 6L6 18 M6 6l12 12',
      plus: 'M12 5v14 M5 12h14',
      min: 'M6 12h12',
      max: 'M6 6h12v12H6z',
      lock: 'M5 11h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z M7 11V7a5 5 0 0 1 10 0v4',
      eye: 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z',
      alert: 'M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z M12 9v4 M12 17h.01',
      sidebar: 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z M9 3v18',
      pen: 'M12 20h9 M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z',
      share: 'M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8 M16 6l-4-4-4 4 M12 2v13'
    };
  }
  renderVals() {
    const th = this.props.theme ?? 'both';
    const all = [{ th: 'th', label: 'Thème clair' }, { th: 'th dark', label: 'Thème sombre' }];
    const themes = th === 'light' ? [all[0]] : th === 'dark' ? [all[1]] : all;
    return { themes, accent: this.props.accent ?? '#3466f6', i: this.icons() };
  }
}
</script>


</body></html>
