<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<title>Feuillet — Modifications non enregistrées</title>
<script src="ecd81a75-abe8-412a-ab15-9f3befdf6e23"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.board{box-sizing:border-box;display:flex;gap:64px;padding:48px;align-items:flex-start;background:#d6d6db;font-family:system-ui,-apple-system,"Cantarell","Noto Sans","Segoe UI",Ubuntu,sans-serif;-webkit-font-smoothing:antialiased}
.bcol{display:flex;flex-direction:column;gap:14px}
.blabel{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#45454d}
.th{--accent:#3466f6;--on-accent:#fff;--bg:#f7f7f8;--chrome:#eeeef1;--sidebar:#eaeaed;--canvas:#dcdce1;--surface:#fff;--surface-2:#f3f3f5;--line:rgba(20,20,35,.10);--line-2:rgba(20,20,35,.18);--text:#1b1b20;--text-2:#52525c;--text-3:#696973;--hover:rgba(20,20,35,.06);--bad:#c02a2a;--tip-bg:#25252a;--tip-fg:#f4f4f6;--shadow-lg:0 2px 8px rgba(0,0,0,.08),0 24px 60px rgba(0,0,0,.22);--scrim:rgba(30,30,40,.30);--accent-soft:color-mix(in oklab,var(--accent) 13%,transparent);--accent-text:color-mix(in oklab,var(--accent) 80%,black);color:var(--text);font-size:13px;line-height:1.4}
.th.dark{--bg:#1e1e22;--chrome:#27272c;--sidebar:#222226;--canvas:#131316;--surface:#2d2d33;--surface-2:#35353b;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.17);--text:#ededf1;--text-2:#acacb6;--text-3:#93939e;--hover:rgba(255,255,255,.07);--bad:#ff7a7a;--tip-bg:#46464e;--shadow-lg:0 2px 8px rgba(0,0,0,.3),0 24px 60px rgba(0,0,0,.6);--scrim:rgba(0,0,0,.5);--accent-soft:color-mix(in oklab,var(--accent) 26%,transparent);--accent-text:color-mix(in oklab,var(--accent) 55%,white)}
.win{position:relative;box-sizing:border-box;width:1280px;height:800px;border-radius:12px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(0,0,0,.16),0 30px 80px rgba(20,20,40,.28)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:16px;height:16px}.ic.xs{width:14px;height:14px}
.titlebar{display:flex;align-items:center;gap:4px;height:42px;padding:0 10px;background:var(--chrome);flex:none}
.tab{position:relative;display:flex;align-items:center;gap:8px;height:30px;width:210px;padding:0 5px 0 10px;border-radius:8px;color:var(--text-2);box-sizing:border-box;font-size:12.5px}
.tab .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.06)}
.th.dark .tab.on{background:var(--surface-2)}
.tab.hov{background:var(--hover);color:var(--text)}
.cl{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--text-3);border:0;background:transparent;padding:0}
.cl.hov{background:var(--hover);color:var(--text)}
.dirty{width:8px;height:8px;border-radius:50%;background:var(--text-2)}
.drag{flex:1;align-self:stretch}
.wctl{display:flex;gap:10px;padding-left:8px}
.wbtn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--hover);color:var(--text-2);border:0;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:30px;padding:0 14px;border-radius:7px;border:0;font:inherit;font-size:13px;font-weight:500;background:var(--hover);color:var(--text);white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.gh{background:transparent;color:var(--text-2)}
.btn.dng{background:transparent;color:var(--bad)}
.btn .kbd{background:rgba(255,255,255,.2);box-shadow:none;color:inherit}
.kbd{display:inline-flex;align-items:center;height:18px;padding:0 5px;border-radius:4px;font:500 11px/1 ui-monospace,"JetBrains Mono","DejaVu Sans Mono",Menlo,monospace;background:var(--hover);box-shadow:inset 0 0 0 1px var(--line);color:var(--text-2)}
.toolbar{display:flex;align-items:center;gap:4px;height:46px;padding:0 10px;background:var(--chrome);border-bottom:1px solid var(--line);flex:none}
.tb{position:relative;display:grid;place-items:center;width:32px;height:32px;border-radius:7px;color:var(--text-2);background:transparent;border:0;padding:0;font:inherit;flex:none}
.tb.on{background:var(--accent-soft);color:var(--accent-text)}
.tb.w{display:flex;width:auto;padding:0 10px;gap:7px;font-size:13px;font-weight:500}
.sep{width:1px;height:20px;background:var(--line-2);margin:0 6px;flex:none}
.grow{flex:1}
.muted{color:var(--text-2);font-size:12.5px}
.tip{position:absolute;z-index:40;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 9px;border-radius:7px;background:var(--tip-bg);color:var(--tip-fg);font-size:12px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.tip .kbd{background:rgba(255,255,255,.14);box-shadow:none;color:#e4e4ea}
.body{flex:1;display:flex;min-height:0;position:relative}
.side{width:232px;flex:none;background:var(--sidebar);border-right:1px solid var(--line)}
.canvas{flex:1;position:relative;overflow:hidden;background:var(--canvas);display:flex;flex-direction:column;align-items:center;min-width:0}
.page{flex:none;width:600px;height:848px;margin-top:28px;background:#fff;box-sizing:border-box;padding:52px 66px;display:flex;flex-direction:column;gap:7px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 12px 32px rgba(0,0,0,.10)}
.ln{position:relative;height:5px;border-radius:2px;background:#e0e0e5;flex:none}
.ln.h{height:12px;width:70%;background:#9a9aa3;margin-bottom:8px}
.ln.k{height:6px;width:40%;background:#b0b0b8;margin-top:12px}
.hlb{position:absolute;top:-4px;bottom:-4px;border-radius:2px;background:rgba(255,205,40,.55)}
.stb{position:absolute;top:2px;height:1.5px;background:#e03131}
.scrim{position:absolute;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:center;justify-content:center}
.modal{width:460px;background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line),var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden}
.mft{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
.th.dark .mft{background:rgba(0,0,0,.12)}
</style>
</helmet>
<div class="board" style="width: 2720px; height: 924px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="bcol">
<div class="blabel">{{t.label}}</div>
<div class="{{t.th}} win" style="--accent: {{accent}}">
<div class="titlebar">
<div class="tab on"><svg class="ic s" sc-camel-view-box="0 0 24 24"><path d="{{i.file}}"></path></svg><span class="nm">Contrat de prestation.pdf</span><button class="cl" aria-label="Modifications non enregistrées — fermer l’onglet"><span class="dirty"></span></button></div>
<div class="tab"><svg class="ic s" sc-camel-view-box="0 0 24 24"><path d="{{i.file}}"></path></svg><span class="nm">Annexes techniques.pdf</span><button class="cl" aria-label="Fermer l’onglet"><svg class="ic xs" sc-camel-view-box="0 0 24 24"><path d="{{i.x}}"></path></svg></button></div>
<button class="cl" style="width: 30px; height: 30px; border-radius: 8px" aria-label="Ouvrir un document (Ctrl O)"><svg class="ic s" sc-camel-view-box="0 0 24 24"><path d="{{i.plus}}"></path></svg></button>
<div class="drag"></div>
<div class="wctl">
<button class="wbtn" aria-label="Réduire"><svg class="ic xs" sc-camel-view-box="0 0 24 24"><path d="{{i.min}}"></path></svg></button>
<button class="wbtn" aria-label="Agrandir"><svg class="ic xs" sc-camel-view-box="0 0 24 24"><path d="{{i.max}}"></path></svg></button>
<button class="wbtn" aria-label="Fermer la fenêtre"><svg class="ic xs" sc-camel-view-box="0 0 24 24"><path d="{{i.x}}"></path></svg></button>
</div>
</div>
<div class="toolbar">
<button class="tb on" aria-label="Barre latérale (F9)"><svg class="ic" sc-camel-view-box="0 0 24 24"><path d="{{i.sidebar}}"></path></svg></button>
<div class="sep"></div>
<span class="muted">Page 1 sur 12</span>
<div class="grow"></div>
<button class="tb w on" aria-label="Annoter (Ctrl Maj A)"><svg class="ic" sc-camel-view-box="0 0 24 24"><path d="{{i.pen}}"></path></svg>Annoter</button>
<button class="tb" aria-label="Partager et exporter (Ctrl Maj E)"><svg class="ic" sc-camel-view-box="0 0 24 24"><path d="{{i.share}}"></path></svg></button>
<button class="tb" aria-label="Plus d’options"><svg class="ic" sc-camel-view-box="0 0 24 24"><path d="{{i.more}}"></path></svg></button>
</div>
<div class="body">
<div class="side"></div>
<div class="canvas">
<div class="page">
<div class="ln h"></div><div class="ln"></div><div class="ln"><span class="hlb" style="left: 30%; right: 0"></span></div><div class="ln" style="width: 80%"><span class="hlb" style="left: 0; right: 40%"></span></div>
<div class="ln k"></div><div class="ln"></div><div class="ln" style="width: 72%"><span class="stb" style="left: 38%; right: 0"></span></div>
<div class="ln k"></div><div class="ln"></div><div class="ln"></div><div class="ln" style="width: 64%"></div>
<div class="ln k"></div><div class="ln"></div><div class="ln"></div><div class="ln" style="width: 50%"></div>
</div>
</div>
</div>
<div class="scrim">
<div class="modal" role="alertdialog" aria-labelledby="sv-title">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 22px 22px 20px">
<h3 id="sv-title" style="margin: 0; font-size: 15px; font-weight: 600">Enregistrer les modifications ?</h3>
<p style="margin: 0; color: var(--text-2); font-size: 13px; line-height: 1.5">« Contrat de prestation.pdf » contient 7 annotations non enregistrées. Elles seront perdues si vous fermez sans enregistrer.</p>
</div>
<div class="mft">
<button class="btn dng" style="margin-right: auto">Fermer sans enregistrer</button>
<button class="btn gh">Annuler</button>
<button class="btn pri">Enregistrer<span class="kbd">Ctrl S</span></button>
</div>
</div>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;both&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;both&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#3466f6&quot;,&quot;#7048e8&quot;,&quot;#e8590c&quot;,&quot;#0c8a6b&quot;],&quot;default&quot;:&quot;#3466f6&quot;},&quot;$preview&quot;:{&quot;width&quot;:2720,&quot;height&quot;:924}}">
class Component extends DCLogic {
  icons() {
    return {
      file: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6',
      x: 'M18 6L6 18 M6 6l12 12',
      plus: 'M12 5v14 M5 12h14',
      min: 'M6 12h12',
      max: 'M6 6h12v12H6z',
      sidebar: 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z M9 3v18',
      pen: 'M12 20h9 M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z',
      share: 'M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8 M16 6l-4-4-4 4 M12 2v13',
      more: 'M12 11.2a.8.8 0 1 0 0 1.6a.8.8 0 1 0 0-1.6z M19 11.2a.8.8 0 1 0 0 1.6a.8.8 0 1 0 0-1.6z M5 11.2a.8.8 0 1 0 0 1.6a.8.8 0 1 0 0-1.6z'
    };
  }
  renderVals() {
    const th = this.props.theme ?? 'both';
    const all = [{ th: 'th', label: 'Thème clair' }, { th: 'th dark', label: 'Thème sombre' }];
    const themes = th === 'light' ? [all[0]] : th === 'dark' ? [all[1]] : all;
    return { themes, accent: this.props.accent ?? '#3466f6', i: this.icons() };
  }
}
</script>


</body></html>
