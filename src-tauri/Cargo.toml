[package]
name = "feuillet"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "feuillet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
feuillet-core = { path = "../crates/feuillet-core", features = ["trust-fetch"] }
tauri = { version = "2.12", features = ["specta"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
specta.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
keyring = "4.2"
sys-locale = "0.3"
sha2 = "0.11"
dirs = "7"
base64 = "0.22"
