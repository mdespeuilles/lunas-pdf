[package]
name = "lunas-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lunas_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
lunas-pdf-core = { path = "../crates/lunas-pdf-core", features = ["trust-fetch"] }
tauri = { version = "2.12", features = ["specta"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
specta.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
keyring = "4.2"
sys-locale = "0.3"
sha2 = "0.11"
dirs = "7"
base64 = "0.22"

# Impression native (dialogue d'impression GTK, déjà embarqué par Tauri sous Linux).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Impression native (NSPrintOperation d'AppKit, déjà embarqué par Tauri sous macOS).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std", "objc2-core-foundation", "objc2-core-graphics",
  "NSGraphicsContext", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "std", "CGColorSpace", "CGContext", "CGDataProvider", "CGImage",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSRange", "NSString"] }
